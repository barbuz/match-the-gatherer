<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Match the Gatherer — a daily Magic: The Gathering card guessing game" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Match the Gatherer</title>
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('mtg:theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
